<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narration Studio — Text Animation Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NARRATION STUDIO — design tokens
   Material metaphor: a physical instrument panel bolted to an
   editing bay. Raw concrete body (neumorphism needs a soft
   mid-tone surface to read), charcoal structural rails top/bottom
   (brutalist framing, stenciled labels), one purposeful accent —
   tally-light red — used only where something is live/selected.
   ============================================================ */
:root{
  --concrete:#DBD7CE;
  --shadow-dark:#B5AFA2;
  --shadow-light:#FFFFFF;
  --charcoal:#1B1A18;
  --charcoal-soft:#2A2824;
  --paper:#F4F2EC;
  --ink:#201F1C;
  --ink-soft:#5B564C;
  --tally:#D8341C;
  --grease:#E8AA00;

  --font-display:'Archivo Black', 'IBM Plex Sans', sans-serif;
  --font-ui:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font-ui);
  color:var(--ink);
  background:var(--charcoal);
  -webkit-font-smoothing:antialiased;
}

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
.hidden{ display:none !important; }

/* ---------- fake editor backdrop (decorative only) ---------- */
.editor-backdrop{
  position:fixed; inset:0; background:#100f0e;
  display:flex; flex-direction:column; padding:18px; gap:14px;
}
.fake-topbar{ display:flex; gap:8px; }
.fake-topbar span{ width:12px; height:12px; border-radius:50%; background:#3a3733; }
.fake-panels{ flex:1; display:flex; gap:14px; min-height:0; }
.fake-panel{ background:#1d1b18; border-radius:6px; }
.fake-panel--tools{ width:15%; }
.fake-panel--preview{ flex:1; background:#151412; }
.fake-panel--props{ width:20%; }
.fake-timeline{ height:120px; background:#1d1b18; border-radius:6px; display:flex; flex-direction:column; gap:8px; padding:12px; }
.fake-track{ height:22px; background:#2a2824; border-radius:3px; width:70%; }
.fake-track:nth-child(2){ width:45%; }
.fake-track:nth-child(3){ width:85%; }

/* ---------- modal overlay + blur ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:rgba(12,11,10,.55);
  backdrop-filter:blur(14px) saturate(1.1);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
}
.reopen-btn{
  font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em;
  font-size:1rem; padding:16px 28px; border-radius:10px;
  background:var(--tally); color:var(--paper); border:2px solid var(--charcoal);
  box-shadow:5px 5px 0 var(--charcoal); cursor:pointer;
}
.reopen-btn:hover{ transform:translate(1px,1px); box-shadow:4px 4px 0 var(--charcoal); }
.reopen-btn:focus-visible{ outline:3px solid var(--paper); outline-offset:4px; }

/* ---------- the instrument window ---------- */
.app-modal{
  width:100%; max-width:1100px; max-height:92vh;
  display:flex; flex-direction:column;
  background:var(--concrete);
  border:2px solid var(--charcoal);
  border-radius:16px;
  box-shadow:0 40px 90px rgba(0,0,0,.5);
  overflow:hidden;
}

.modal-header{
  background:var(--charcoal); color:var(--paper);
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; flex-shrink:0;
}
.modal-title-wrap{ display:flex; flex-direction:column; gap:2px; }
.modal-kicker{
  font-family:var(--font-mono); font-size:.68rem; text-transform:uppercase;
  letter-spacing:.12em; color:var(--tally);
}
.modal-header h1{
  margin:0; font-family:var(--font-display); font-size:1.3rem;
  text-transform:uppercase; letter-spacing:.03em; font-weight:400;
}
.icon-btn{
  width:38px; height:38px; border-radius:8px; border:2px solid transparent;
  background:transparent; color:var(--paper); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover{ background:var(--charcoal-soft); }
.icon-btn:focus-visible{ outline:3px solid var(--paper); outline-offset:2px; }

.modal-body{
  display:flex; flex:1; min-height:0; overflow:hidden;
}
.stage-panel{
  flex:1 1 56%; padding:24px; display:flex; flex-direction:column; gap:16px;
  overflow-y:auto; border-right:2px solid rgba(27,26,24,.12);
}
.controls-panel{
  flex:1 1 44%; padding:24px; overflow-y:auto; min-width:300px;
  display:flex; flex-direction:column;
}

/* ---------- stage / viewfinder ---------- */
.stage-frame{ width:100%; }
.stage{
  position:relative; width:100%; aspect-ratio:16/9;
  border:2px solid var(--charcoal); border-radius:0;
  overflow:hidden; display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 26px rgba(0,0,0,.3);
  padding:24px;
}
.stage-guides{
  position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.28) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.28) 1px, transparent 1px);
  background-size:33.333% 33.333%;
}
.stage-text-wrap{
  position:relative; display:inline-block; max-width:100%; text-align:center;
}
.preview-text{
  display:inline-block; margin:0; word-wrap:break-word; overflow-wrap:break-word;
}
.unit{ display:inline-block; }
.word-group{ display:inline-block; white-space:nowrap; }
.tw-cursor{
  display:inline-block; margin-left:2px;
  animation:caretBlink 1s steps(1) infinite;
}
.scan-bar{
  position:absolute; top:0; bottom:0; left:0; width:3px;
  background:linear-gradient(180deg, transparent, var(--tally), transparent);
  box-shadow:0 0 14px var(--tally);
  animation-fill-mode:both;
}

.stage-toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px; }
.preview-status{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-soft);
}
.tally-dot{
  width:9px; height:9px; border-radius:50%; background:var(--ink-soft);
  box-shadow:none; flex-shrink:0;
}
.tally-dot.is-live{
  background:var(--tally); box-shadow:0 0 8px var(--tally);
  animation:tallyPulse 1.1s ease-in-out infinite;
}
.stage-bg-label{
  display:flex; align-items:center; gap:8px; margin-left:auto;
  font-family:var(--font-ui); font-size:.75rem; font-weight:600;
  text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--font-ui); font-weight:700; font-size:.82rem;
  text-transform:uppercase; letter-spacing:.04em; padding:10px 18px;
  border-radius:8px; cursor:pointer; border:2px solid var(--ink);
  background:var(--concrete); color:var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{ transform:translate(1px,1px); box-shadow:3px 3px 0 var(--ink); }
.btn:active{ transform:translate(4px,4px); box-shadow:0 0 0 var(--ink); }
.btn:focus-visible{ outline:3px solid var(--charcoal); outline-offset:3px; }
.btn--brutal{
  background:var(--tally); border-color:var(--charcoal); color:var(--paper);
  box-shadow:4px 4px 0 var(--charcoal); font-size:.9rem;
}
.btn--brutal:hover{ box-shadow:3px 3px 0 var(--charcoal); }
.btn--brutal:active{ box-shadow:0 0 0 var(--charcoal); }
.btn--small{ padding:6px 12px; font-size:.68rem; box-shadow:3px 3px 0 var(--ink); }

/* ---------- switches (loop / guides / plate / fx toggles) ---------- */
.switch{ display:inline-flex; align-items:center; gap:9px; cursor:pointer; }
.switch input{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap;
}
.switch-track{
  width:36px; height:20px; border-radius:12px; background:var(--concrete);
  box-shadow:inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
  position:relative; flex-shrink:0;
}
.switch-thumb{
  position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:50%; background:var(--ink-soft); transition:transform .15s, background .15s;
}
.switch input:checked + .switch-track{ background:var(--tally); }
.switch input:checked + .switch-track .switch-thumb{ transform:translateX(16px); background:var(--paper); }
.switch input:focus-visible + .switch-track{ outline:3px solid var(--charcoal); outline-offset:2px; }
.switch-label{
  font-family:var(--font-ui); font-size:.78rem; font-weight:600;
  text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
}

/* ---------- tabs ---------- */
.tabs{
  display:flex; gap:6px; padding:6px; background:var(--concrete);
  border-radius:12px; margin-bottom:18px; flex-shrink:0;
  box-shadow:inset 3px 3px 8px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light);
}
.tab-btn{
  flex:1; padding:10px 6px; border:none; background:transparent; border-radius:8px;
  font-family:var(--font-ui); font-weight:700; font-size:.74rem; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-soft); cursor:pointer;
}
.tab-btn[aria-selected="true"]{
  background:var(--concrete); color:var(--tally);
  box-shadow:4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
}
.tab-btn:focus-visible{ outline:3px solid var(--charcoal); outline-offset:2px; }
.tab-panel{ display:flex; flex-direction:column; }

/* ---------- fields ---------- */
.field{ display:flex; flex-direction:column; gap:7px; margin-bottom:18px; }
.field-row{ display:flex; gap:14px; }
.field-row .field{ flex:1; }
.field > label, fieldset.field > legend{
  font-family:var(--font-ui); font-size:.74rem; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-soft); padding:0;
}
.field-hint{ font-size:.7rem; color:var(--ink-soft); font-weight:400; text-transform:none; letter-spacing:0; }
select, textarea, input[type="text"]{
  font-family:var(--font-ui); font-size:.88rem; color:var(--ink);
  padding:10px 12px; border:none; border-radius:10px; width:100%;
  background:var(--concrete);
  box-shadow:inset 3px 3px 8px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light);
}
textarea{ resize:vertical; min-height:64px; font-family:var(--font-mono); line-height:1.4; }
select:focus-visible, textarea:focus-visible, input[type="text"]:focus-visible{
  outline:3px solid var(--charcoal); outline-offset:2px;
}
fieldset.field{ border:none; margin:0 0 18px; padding:0; }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }

.toggle-btn{
  width:42px; height:42px; border-radius:8px; border:2px solid transparent;
  background:var(--concrete); box-shadow:5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
  font-family:var(--font-ui); font-weight:700; font-size:1rem; color:var(--ink); cursor:pointer;
}
.toggle-btn[aria-pressed="true"]{
  box-shadow:inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  border-color:var(--tally); color:var(--tally);
}
.toggle-btn:focus-visible{ outline:3px solid var(--charcoal); outline-offset:2px; }
.toggle-btn.tb-italic{ font-style:italic; }
.toggle-btn.tb-underline{ text-decoration:underline; }
.toggle-btn.tb-strike{ text-decoration:line-through; }

/* range sliders — grease-pencil ticked groove */
input[type="range"]{
  -webkit-appearance:none; appearance:none; width:100%; height:26px; background:transparent;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:10px; border-radius:6px;
  background:
    repeating-linear-gradient(90deg, rgba(32,31,28,.22) 0 1px, transparent 1px 10%),
    var(--concrete);
  box-shadow:inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
}
input[type="range"]::-moz-range-track{
  height:10px; border-radius:6px; background:var(--concrete);
  box-shadow:inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px; height:24px; margin-top:-7px;
  background:var(--charcoal); border-top:3px solid var(--tally); border-radius:3px; cursor:pointer;
  box-shadow:2px 2px 0 rgba(0,0,0,.3);
}
input[type="range"]::-moz-range-thumb{
  width:16px; height:24px; background:var(--charcoal); border:none;
  border-top:3px solid var(--tally); border-radius:3px; cursor:pointer;
}
input[type="range"]:focus-visible{ outline:3px solid var(--charcoal); outline-offset:5px; border-radius:6px; }

input[type="color"]{
  width:46px; height:38px; padding:2px; border-radius:8px;
  border:2px solid var(--ink); background:var(--concrete); cursor:pointer;
}
input[type="color"]:focus-visible{ outline:3px solid var(--charcoal); outline-offset:2px; }

.swatch-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; }
.swatch{
  width:26px; height:26px; border-radius:6px; border:2px solid var(--ink);
  cursor:pointer; box-shadow:2px 2px 0 rgba(0,0,0,.2);
}
.swatch:focus-visible{ outline:3px solid var(--charcoal); outline-offset:2px; }

.fx-block{
  border:1px solid rgba(27,26,24,.14); border-radius:12px; padding:14px; margin-bottom:16px;
}
.fx-block-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.fx-block-head > span{
  font-family:var(--font-ui); font-weight:700; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em;
}
.fx-body{ display:flex; flex-direction:column; gap:12px; }
.fx-body[hidden]{ display:none; }

/* ---------- footer + export drawer ---------- */
.export-panel{
  background:var(--charcoal-soft); color:var(--paper); padding:16px 22px;
  border-top:2px solid var(--charcoal); max-height:220px; overflow:auto; flex-shrink:0;
}
.export-panel-head{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
  font-family:var(--font-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; opacity:.85;
}
.export-code{ font-family:var(--font-mono); font-size:.76rem; line-height:1.5; white-space:pre-wrap; word-break:break-word; margin:0; }
.export-panel .btn--small{ border-color:var(--paper); color:var(--paper); box-shadow:3px 3px 0 var(--paper); background:transparent; }
.export-panel .btn--small:hover{ box-shadow:2px 2px 0 var(--paper); }
.export-panel .btn--small:focus-visible{ outline:3px solid var(--paper); outline-offset:2px; }

.modal-footer{
  background:var(--charcoal); padding:14px 22px; display:flex; gap:12px;
  justify-content:flex-end; flex-shrink:0;
}
.modal-footer .btn{ border-color:var(--paper); color:var(--paper); box-shadow:4px 4px 0 var(--paper); background:transparent; }
.modal-footer .btn:hover{ box-shadow:3px 3px 0 var(--paper); }
.modal-footer .btn:active{ box-shadow:0 0 0 var(--paper); }
.modal-footer .btn:focus-visible{ outline:3px solid var(--paper); outline-offset:3px; }

/* ---------- responsive ---------- */
@media (max-width: 820px){
  .modal-body{ flex-direction:column; }
  .stage-panel{ border-right:none; border-bottom:2px solid rgba(27,26,24,.12); }
  .field-row{ flex-direction:column; }
}
@media (max-width: 480px){
  .modal-header h1{ font-size:1rem; }
  .btn{ padding:9px 14px; font-size:.74rem; }
}

/* ---------- keyframes: entrance animations ---------- */
@keyframes animFadeIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes animSlideUp{ from{ opacity:0; transform:translateY(34px); } to{ opacity:1; transform:translateY(0); } }
@keyframes animScalePop{ 0%{ opacity:0; transform:scale(.55); } 70%{ opacity:1; transform:scale(1.06); } 100%{ opacity:1; transform:scale(1); } }
@keyframes animWordBlur{ from{ opacity:0; filter:blur(11px); transform:translateY(8px); } to{ opacity:1; filter:blur(0); transform:translateY(0); } }
@keyframes animCharPop{
  0%{ opacity:0; transform:translateY(18px) scale(.5) rotate(-5deg); }
  55%{ opacity:1; transform:translateY(-4px) scale(1.1) rotate(2deg); }
  100%{ opacity:1; transform:translateY(0) scale(1) rotate(0); }
}
@keyframes animGlitch{
  0%{ opacity:0; transform:translate(0,0); }
  8%{ opacity:1; transform:translate(-5px,2px); text-shadow:3px 0 var(--tally), -3px 0 var(--grease); }
  16%{ transform:translate(4px,-2px); }
  24%{ transform:translate(-3px,1px); text-shadow:-2px 0 var(--tally), 2px 0 var(--grease); }
  32%{ transform:translate(2px,-1px); text-shadow:none; }
  40%{ transform:translate(-1px,1px); }
  50%,100%{ opacity:1; transform:translate(0,0); text-shadow:none; }
}
@keyframes animLineReveal{ from{ clip-path:inset(0 100% 0 0); } to{ clip-path:inset(0 0% 0 0); } }
@keyframes animScanBar{ from{ left:0%; opacity:1; } 92%{ opacity:1; } to{ left:100%; opacity:0; } }
@keyframes caretBlink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
@keyframes tallyPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

/* chrome transitions (not the preview itself) respect reduced motion */
@media (prefers-reduced-motion: reduce){
  .btn, .switch-thumb, .tab-btn, .toggle-btn, .icon-btn{ transition:none !important; }
  .tally-dot.is-live{ animation:none !important; opacity:1; }
}
</style>
</head>
<body>

<div class="editor-backdrop" aria-hidden="true">
  <div class="fake-topbar"><span></span><span></span><span></span></div>
  <div class="fake-panels">
    <div class="fake-panel fake-panel--tools"></div>
    <div class="fake-panel fake-panel--preview"></div>
    <div class="fake-panel fake-panel--props"></div>
  </div>
  <div class="fake-timeline">
    <div class="fake-track"></div>
    <div class="fake-track"></div>
    <div class="fake-track"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">

  <div class="app-modal" id="appModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-header">
      <div class="modal-title-wrap">
        <span class="modal-kicker">Edit · Text Layer</span>
        <h1 id="modalTitle">Narration Studio</h1>
      </div>
      <button type="button" class="icon-btn" id="closeBtn" aria-label="Close narration editor">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="modal-body">
      <!-- ============ STAGE ============ -->
      <section class="stage-panel" aria-label="Preview">
        <div class="stage-frame">
          <div class="stage" id="stage">
            <div class="stage-guides" id="stageGuides" hidden aria-hidden="true"></div>
            <div class="stage-text-wrap" id="stageTextWrap">
              <p id="previewText" class="preview-text">Loading…</p>
            </div>
          </div>
        </div>

        <div class="stage-toolbar">
          <button type="button" class="btn btn--brutal" id="replayBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false"><path d="M6 4L20 12L6 20Z" fill="currentColor"/></svg>
            Replay
          </button>

          <label class="switch">
            <input type="checkbox" id="loopToggle">
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-label">Loop</span>
          </label>

          <label class="switch">
            <input type="checkbox" id="guidesToggle">
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-label">Guides</span>
          </label>

          <span class="preview-status">
            <span class="tally-dot" id="tallyDot"></span> Preview
          </span>

          <label class="stage-bg-label" for="stageBgColor">
            Frame <input type="color" id="stageBgColor" value="#14171c">
          </label>
        </div>

        <p class="sr-only" id="liveStatus" aria-live="polite"></p>
      </section>

      <!-- ============ CONTROLS ============ -->
      <section class="controls-panel" aria-label="Text and animation controls">
        <div class="tabs" role="tablist" aria-label="Control categories">
          <button type="button" role="tab" id="tab-text" aria-controls="panel-text" aria-selected="true" class="tab-btn" tabindex="0">Text</button>
          <button type="button" role="tab" id="tab-animate" aria-controls="panel-animate" aria-selected="false" class="tab-btn" tabindex="-1">Animate</button>
          <button type="button" role="tab" id="tab-style" aria-controls="panel-style" aria-selected="false" class="tab-btn" tabindex="-1">Style</button>
          <button type="button" role="tab" id="tab-effects" aria-controls="panel-effects" aria-selected="false" class="tab-btn" tabindex="-1">Effects</button>
        </div>

        <!-- TEXT TAB -->
        <section id="panel-text" role="tabpanel" aria-labelledby="tab-text" class="tab-panel">
          <div class="field">
            <label for="textInput">Narration text</label>
            <textarea id="textInput" rows="3">The story begins in silence.</textarea>
          </div>

          <div class="field">
            <label for="fontFamily">Font</label>
            <select id="fontFamily">
              <option value="'Space Grotesk', sans-serif" selected>Space Grotesk — geometric</option>
              <option value="'Archivo Black', sans-serif">Archivo Black — brutalist display</option>
              <option value="'Bebas Neue', sans-serif">Bebas Neue — condensed</option>
              <option value="'IBM Plex Sans', sans-serif">IBM Plex Sans — technical</option>

                <div class="field"><label for="glowOpacity">Intensity <span id="glowOpacityOut">70%</span></label><input type="range" id="glowOpacity" min="0" max="100" step="5" value="70"></div>

                <div class="field"><label for="strokeWidth">Width <span id="strokeWidthOut">2px</span></label><input type="range" id="strokeWidth" min="0" max="6" step="0.5" value="2"></div>

      <button type="button" class="btn btn--small" id="resetBtn">Reset</button>
      <button type="button" class="btn btn--small" id="exportBtn" aria-expanded="false" aria-controls="exportPanel">Export JSON</button>
      <button type="button" class="btn btn--brutal" id="applyBtn">Apply</button>
    </footer>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------
     Note on future expansion: `state` below models a single
     TEXT layer. When shapes/visuals are added later, the same
     shape — content + typography + animation + effects — can
     become one entry in a `layers[]` array; playAnimation() and
     buildExportObject() are already written per-layer so this
     scales without a rewrite.
  ------------------------------------------------------------- */

  var DEFAULT_STATE = {
    text: "The story begins in silence.",
    fontFamily: "'Space Grotesk', sans-serif",
    fontSize: 64,
    fontWeight: 600,
    letterSpacing: 0,
    lineHeight: 1.15,
    textAlign: "center",
    bold: false, italic: false, underline: false, strike: false, uppercase: false,

    animType: "wordblur",
    animDuration: 700,
    animDelay: 0,
    animStagger: 40,
    animEasing: "easeInOut",
    loop: false,
    loopPause: 900,
    reducedMotion: false,

    textColor: "#f5f4f0",
    plate: false, plateColor: "#111111", platePadding: 24, plateRadius: 0,

    shadow: false, shadowX: 4, shadowY: 4, shadowBlur: 0, shadowColor: "#000000", shadowOpacity: 60,
    glow: false, glowColor: "#d8341c", glowBlur: 20, glowOpacity: 70,
    stroke: false, strokeWidth: 2, strokeColor: "#111111",
    textOpacity: 100,

    stageBg: "#14171c",
    guides: false
  };

  var state = Object.assign({}, DEFAULT_STATE);

  var PLACEHOLDER_TEXT = "Your narration text will appear here.";
  var SWATCHES = ["#f5f4f0", "#111111", "#d8341c", "#e8aa00", "#2f6fed", "#ff6fae"];

  var EASING_MAP = {
    linear: "linear", ease: "ease", easeInOut: "ease-in-out", easeOut: "ease-out",
    snap: "steps(6, end)", bounce: "cubic-bezier(.34,1.56,.64,1)"
  };
  var ANIM_NAME_MAP = { fade: "animFadeIn", slideup: "animSlideUp", scalepop: "animScalePop", glitch: "animGlitch" };
  var ANIM_LABELS = {
    none: "static text", fade: "Fade In", slideup: "Slide Up", scalepop: "Scale Pop",
    typewriter: "Typewriter", wordblur: "Word Blur In", charstagger: "Character Stagger",
    linescan: "Line Scan", glitch: "Glitch"
  };

  function $(id){ return document.getElementById(id); }

  var els = {
    stage: $("stage"), stageGuides: $("stageGuides"), stageTextWrap: $("stageTextWrap"),
    previewText: $("previewText"), tallyDot: $("tallyDot"), liveStatus: $("liveStatus"),

    replayBtn: $("replayBtn"), loopToggle: $("loopToggle"), guidesToggle: $("guidesToggle"),
    stageBgColor: $("stageBgColor"),

    appModal: $("appModal"), modalOverlay: $("modalOverlay"), closeBtn: $("closeBtn"), applyBtn: $("applyBtn"),
    resetBtn: $("resetBtn"), exportBtn: $("exportBtn"), exportPanel: $("exportPanel"),
    exportCode: $("exportCode"), copyJsonBtn: $("copyJsonBtn"),

    textInput: $("textInput"), fontFamily: $("fontFamily"), fontSize: $("fontSize"), fontSizeOut: $("fontSizeOut"),
    fontWeight: $("fontWeight"), letterSpacing: $("letterSpacing"), letterSpacingOut: $("letterSpacingOut"),
    lineHeight: $("lineHeight"), lineHeightOut: $("lineHeightOut"), textAlign: $("textAlign"),

    animType: $("animType"), animDuration: $("animDuration"), animDurationOut: $("animDurationOut"),
    animDelay: $("animDelay"), animDelayOut: $("animDelayOut"), animStagger: $("animStagger"),
    animStaggerOut: $("animStaggerOut"), animEasing: $("animEasing"), loopPause: $("loopPause"),
    loopPauseOut: $("loopPauseOut"), reducedMotionToggle: $("reducedMotionToggle"),

    textColor: $("textColor"), colorSwatches: $("colorSwatches"),
    plateToggle: $("plateToggle"), plateBody: $("plateBody"), plateColor: $("plateColor"),
    platePadding: $("platePadding"), platePaddingOut: $("platePaddingOut"),
    plateRadius: $("plateRadius"), plateRadiusOut: $("plateRadiusOut"),

    shadowToggle: $("shadowToggle"), shadowBody: $("shadowBody"), shadowX: $("shadowX"), shadowXOut: $("shadowXOut"),
    shadowY: $("shadowY"), shadowYOut: $("shadowYOut"), shadowBlur: $("shadowBlur"), shadowBlurOut: $("shadowBlurOut"),
    shadowOpacity: $("shadowOpacity"), shadowOpacityOut: $("shadowOpacityOut"), shadowColor: $("shadowColor"),

    glowToggle: $("glowToggle"), glowBody: $("glowBody"), glowBlur: $("glowBlur"), glowBlurOut: $("glowBlurOut"),
    glowOpacity: $("glowOpacity"), glowOpacityOut: $("glowOpacityOut"), glowColor: $("glowColor"),

    strokeToggle: $("strokeToggle"), strokeBody: $("strokeBody"), strokeWidth: $("strokeWidth"),
    strokeWidthOut: $("strokeWidthOut"), strokeColor: $("strokeColor"),

    textOpacity: $("textOpacity"), textOpacityOut: $("textOpacityOut")
  };

  var typeTimer = null, loopTimer = null;

  function clearAllTimers(){
    if (typeTimer) clearTimeout(typeTimer);
    if (loopTimer) clearTimeout(loopTimer);
    typeTimer = null; loopTimer = null;
  }

  function announce(msg){ els.liveStatus.textContent = msg; }

  function hexToRgba(hex, alpha){
    var h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(function(c){ return c + c; }).join("");
    var bigint = parseInt(h, 16);
    var r = (bigint >> 16) & 255, g = (bigint >> 8) & 255, b = bigint & 255;
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  /* ---------------- static (non-animated) style application ---------------- */
  function applyStaticTextStyles(){
    var p = els.previewText, wrap = els.stageTextWrap;

    p.style.fontFamily = state.fontFamily;
    p.style.fontSize = state.fontSize + "px";
    p.style.letterSpacing = state.letterSpacing + "px";
    p.style.lineHeight = state.lineHeight;
    p.style.textAlign = state.textAlign;
    p.style.color = state.textColor;
    p.style.fontStyle = state.italic ? "italic" : "normal";
    p.style.fontWeight = state.bold ? Math.max(700, Number(state.fontWeight)) : state.fontWeight;

    var decoLines = [];
    if (state.underline) decoLines.push("underline");
    if (state.strike) decoLines.push("line-through");
    p.style.textDecorationLine = decoLines.length ? decoLines.join(" ") : "none";
    p.style.textTransform = state.uppercase ? "uppercase" : "none";
    p.style.opacity = state.textOpacity / 100;

    var shadows = [];
    if (state.shadow){
      shadows.push(state.shadowX + "px " + state.shadowY + "px " + state.shadowBlur + "px " + hexToRgba(state.shadowColor, state.shadowOpacity / 100));
    }
    if (state.glow){
      var g = hexToRgba(state.glowColor, state.glowOpacity / 100);
      var b = state.glowBlur;
      shadows.push("0 0 " + (b * 0.3) + "px " + g, "0 0 " + b + "px " + g, "0 0 " + (b * 1.8) + "px " + g);
    }
    p.style.textShadow = shadows.length ? shadows.join(", ") : "none";

    if (state.stroke && state.strokeWidth > 0){
      p.style.webkitTextStroke = state.strokeWidth + "px " + state.strokeColor;
    } else {
      p.style.webkitTextStroke = "0px transparent";
    }

    if (state.plate){
      wrap.style.background = state.plateColor;
      wrap.style.padding = state.platePadding + "px";
      wrap.style.borderRadius = state.plateRadius + "px";
    } else {
      wrap.style.background = "transparent";
      wrap.style.padding = "0";
      wrap.style.borderRadius = "0";
    }

    els.stage.style.background = state.stageBg;
  }

  /* ---------------- span builders ---------------- */
  function buildWordSpans(container, text){
    container.innerHTML = "";
    var words = text.split(" ");
    words.forEach(function(w, i){
      var span = document.createElement("span");
      span.className = "unit unit--word";
      span.textContent = w;
      container.appendChild(span);
      if (i < words.length - 1) container.appendChild(document.createTextNode(" "));
    });
  }

  function buildCharSpans(container, text){
    container.innerHTML = "";
    var words = text.split(" ");
    var idx = 0;
    words.forEach(function(word, wi){
      var wordSpan = document.createElement("span");
      wordSpan.className = "word-group";
      word.split("").forEach(function(ch){
        var charSpan = document.createElement("span");
        charSpan.className = "unit unit--char";
        charSpan.textContent = ch;
        charSpan.dataset.index = String(idx++);
        wordSpan.appendChild(charSpan);
      });
      container.appendChild(wordSpan);
      if (wi < words.length - 1){
        container.appendChild(document.createTextNode(" "));
        idx++;
      }
    });
  }

  function runTypewriter(container, text, totalMs, onDone){
    container.innerHTML = "";
    var textNode = document.createTextNode("");
    container.appendChild(textNode);
    var cursor = document.createElement("span");
    cursor.className = "tw-cursor";
    cursor.setAttribute("aria-hidden", "true");
    cursor.textContent = "|";
    container.appendChild(cursor);

    var total = text.length;
    var perCharMs = total > 0 ? totalMs / total : 0;
    var i = 0;

    function step(){
      textNode.textContent = text.slice(0, i);
      i++;
      if (i <= total){
        typeTimer = setTimeout(step, perCharMs);
      } else if (onDone){
        onDone();
      }
    }
    step();
  }

  function getTotalDurationMs(text, animType, delay, duration, stagger){
    if (animType === "wordblur"){
      var wn = text.split(" ").length;
      return delay + (wn - 1) * stagger + duration;
    }
    if (animType === "charstagger"){
      return delay + (text.length - 1) * stagger + duration;
    }
    return delay + duration;
  }

  function scheduleLoop(ms){
    loopTimer = setTimeout(function(){
      if (state.loop) playAnimation();
    }, ms);
  }

  /* ---------------- master play function ---------------- */
  function playAnimation(){
    clearAllTimers();
    applyStaticTextStyles();

    var p = els.previewText, wrap = els.stageTextWrap;
    p.className = "preview-text";
    p.style.animationName = "";
    var oldBar = wrap.querySelector(".scan-bar");
    if (oldBar) oldBar.remove();

    var text = (state.text && state.text.trim()) ? state.text : PLACEHOLDER_TEXT;
    var reduced = state.reducedMotion;
    var dur = reduced ? Math.min(state.animDuration, 150) : state.animDuration;
    var delay = reduced ? 0 : state.animDelay;
    var stagger = reduced ? 0 : state.animStagger;
    var ease = EASING_MAP[state.animEasing] || "ease";
    var animType = state.animType;
    if (reduced && animType === "glitch") animType = "fade";

    els.tallyDot.classList.add("is-live");

    function forceReflow(el){ return el.offsetWidth; }

    switch (animType){
      case "none":
        p.textContent = text;
        break;

      case "fade":
      case "slideup":
      case "scalepop":
      case "glitch":
        p.textContent = text;
        forceReflow(p);
        p.style.animationDuration = dur + "ms";
        p.style.animationDelay = delay + "ms";
        p.style.animationTimingFunction = ease;
        p.style.animationFillMode = "both";
        p.style.animationName = ANIM_NAME_MAP[animType];
        break;

      case "linescan":
        p.textContent = text;
        forceReflow(p);
        p.style.animationDuration = dur + "ms";
        p.style.animationDelay = delay + "ms";
        p.style.animationTimingFunction = ease;
        p.style.animationFillMode = "both";
        p.style.animationName = "animLineReveal";
        var bar = document.createElement("span");
        bar.className = "scan-bar";
        bar.style.animationDuration = dur + "ms";
        bar.style.animationDelay = delay + "ms";
        bar.style.animationTimingFunction = ease;
        bar.style.animationName = "animScanBar";
        wrap.appendChild(bar);
        break;

      case "wordblur":
        buildWordSpans(p, text);
        Array.prototype.forEach.call(p.querySelectorAll(".unit--word"), function(span, i){
          span.style.animationDuration = dur + "ms";
          span.style.animationDelay = (delay + i * stagger) + "ms";
          span.style.animationTimingFunction = ease;
          span.style.animationFillMode = "both";
          span.style.animationName = "animWordBlur";
        });
        break;

      case "charstagger":
        buildCharSpans(p, text);
        Array.prototype.forEach.call(p.querySelectorAll(".unit--char"), function(span, i){
          span.style.animationDuration = dur + "ms";
          span.style.animationDelay = (delay + i * stagger) + "ms";
          span.style.animationTimingFunction = ease;
          span.style.animationFillMode = "both";
          span.style.animationName = "animCharPop";
        });
        break;

      case "typewriter":
        runTypewriter(p, text, dur, function(){
          if (state.loop && !reduced) scheduleLoop(state.loopPause);
        });
        break;
    }

    announce("Previewing " + ANIM_LABELS[animType] + " animation");

    if (animType !== "typewriter" && state.loop && !reduced){
      var total = getTotalDurationMs(text, animType, delay, dur, stagger);
      scheduleLoop(total + state.loopPause);
    }
  }

  /* ---------------- range helper ---------------- */
  function bindRange(input, outEl, unit, onSet){
    function sync(){
      var v = input.value;
      if (outEl) outEl.textContent = v + unit;
      var unitWord = unit === "%" ? " percent" : unit === "px" ? " pixels" : unit === "ms" ? " milliseconds" : unit;
      input.setAttribute("aria-valuetext", v + unitWord);
      onSet(v);
    }
    input.addEventListener("input", sync);
    sync();
  }

  /* ---------------- sync controls FROM state (init / reset) ---------------- */
  function syncControlsFromState(){
    els.textInput.value = state.text;
    els.fontFamily.value = state.fontFamily;
    els.fontSize.value = state.fontSize; els.fontSizeOut.textContent = state.fontSize + "px";
    els.fontWeight.value = state.fontWeight;
    els.letterSpacing.value = state.letterSpacing; els.letterSpacingOut.textContent = state.letterSpacing + "px";
    els.lineHeight.value = state.lineHeight; els.lineHeightOut.textContent = state.lineHeight;
    els.textAlign.value = state.textAlign;

    setPressed(els_btnBold(), state.bold);
    setPressed(els_btnItalic(), state.italic);
    setPressed(els_btnUnderline(), state.underline);
    setPressed(els_btnStrike(), state.strike);
    setPressed(els_btnUppercase(), state.uppercase);

    els.animType.value = state.animType;
    els.animDuration.value = state.animDuration; els.animDurationOut.textContent = state.animDuration + "ms";
    els.animDelay.value = state.animDelay; els.animDelayOut.textContent = state.animDelay + "ms";
    els.animStagger.value = state.animStagger; els.animStaggerOut.textContent = state.animStagger + "ms";
    els.animEasing.value = state.animEasing;
    els.loopPause.value = state.loopPause; els.loopPauseOut.textContent = state.loopPause + "ms";
    els.loopToggle.checked = state.loop;
    els.reducedMotionToggle.checked = state.reducedMotion;

    els.textColor.value = state.textColor;
    els.plateToggle.checked = state.plate; els.plateBody.hidden = !state.plate;
    els.plateColor.value = state.plateColor;
    els.platePadding.value = state.platePadding; els.platePaddingOut.textContent = state.platePadding + "px";
    els.plateRadius.value = state.plateRadius; els.plateRadiusOut.textContent = state.plateRadius + "px";

    els.shadowToggle.checked = state.shadow; els.shadowBody.hidden = !state.shadow;
    els.shadowX.value = state.shadowX; els.shadowXOut.textContent = state.shadowX + "px";
    els.shadowY.value = state.shadowY; els.shadowYOut.textContent = state.shadowY + "px";
    els.shadowBlur.value = state.shadowBlur; els.shadowBlurOut.textContent = state.shadowBlur + "px";
    els.shadowOpacity.value = state.shadowOpacity; els.shadowOpacityOut.textContent = state.shadowOpacity + "%";
    els.shadowColor.value = state.shadowColor;

    els.glowToggle.checked = state.glow; els.glowBody.hidden = !state.glow;
    els.glowBlur.value = state.glowBlur; els.glowBlurOut.textContent = state.glowBlur + "px";
    els.glowOpacity.value = state.glowOpacity; els.glowOpacityOut.textContent = state.glowOpacity + "%";
    els.glowColor.value = state.glowColor;

    els.strokeToggle.checked = state.stroke; els.strokeBody.hidden = !state.stroke;
    els.strokeWidth.value = state.strokeWidth; els.strokeWidthOut.textContent = state.strokeWidth + "px";
    els.strokeColor.value = state.strokeColor;

    els.textOpacity.value = state.textOpacity; els.textOpacityOut.textContent = state.textOpacity + "%";

    els.stageBgColor.value = state.stageBg;
    els.guidesToggle.checked = state.guides;
    els.stageGuides.hidden = !state.guides;
  }

  function setPressed(btn, val){ btn.setAttribute("aria-pressed", val ? "true" : "false"); }
  function els_btnBold(){ return $("btnBold"); }
  function els_btnItalic(){ return $("btnItalic"); }
  function els_btnUnderline(){ return $("btnUnderline"); }
  function els_btnStrike(){ return $("btnStrike"); }
  function els_btnUppercase(){ return $("btnUppercase"); }

  /* ---------------- export ---------------- */
  function buildExportObject(){
    return {
      type: "text-narration-layer",
      content: state.text,
      typography: {
        fontFamily: state.fontFamily, fontSize: state.fontSize,
        fontWeight: state.bold ? Math.max(700, Number(state.fontWeight)) : state.fontWeight,
        italic: state.italic, underline: state.underline, strikethrough: state.strike, uppercase: state.uppercase,
        letterSpacing: state.letterSpacing, lineHeight: state.lineHeight, align: state.textAlign, color: state.textColor
      },
      animation: {
        type: state.animType, durationMs: state.animDuration, delayMs: state.animDelay,
        staggerMs: state.animStagger, easing: state.animEasing, loop: state.loop, loopPauseMs: state.loopPause
      },
      effects: {
        shadow: state.shadow ? { x: state.shadowX, y: state.shadowY, blur: state.shadowBlur, color: state.shadowColor, opacity: state.shadowOpacity } : null,
        glow: state.glow ? { color: state.glowColor, blur: state.glowBlur, opacity: state.glowOpacity } : null,
        stroke: state.stroke ? { width: state.strokeWidth, color: state.strokeColor } : null,
        opacity: state.textOpacity
      },
      plate: state.plate ? { color: state.plateColor, padding: state.platePadding, radius: state.plateRadius } : null,
      frame: { background: state.stageBg }
    };
  }

  /* ---------------- event bindings ---------------- */
  function bindEvents(){
    els.textInput.addEventListener("input", function(){ state.text = this.value; playAnimation(); });

    els.fontFamily.addEventListener("change", function(){ state.fontFamily = this.value; applyStaticTextStyles(); });
    bindRange(els.fontSize, els.fontSizeOut, "px", function(v){ state.fontSize = Number(v); applyStaticTextStyles(); });
    els.fontWeight.addEventListener("change", function(){ state.fontWeight = Number(this.value); applyStaticTextStyles(); });
    bindRange(els.letterSpacing, els.letterSpacingOut, "px", function(v){ state.letterSpacing = Number(v); applyStaticTextStyles(); });
    bindRange(els.lineHeight, els.lineHeightOut, "", function(v){ state.lineHeight = Number(v); applyStaticTextStyles(); });
    els.textAlign.addEventListener("change", function(){ state.textAlign = this.value; applyStaticTextStyles(); });

    [["btnBold","bold"],["btnItalic","italic"],["btnUnderline","underline"],["btnStrike","strike"],["btnUppercase","uppercase"]].forEach(function(pair){
      var btn = $(pair[0]), key = pair[1];
      btn.addEventListener("click", function(){
        state[key] = !state[key];
        setPressed(btn, state[key]);
        applyStaticTextStyles();
      });
    });

    els.animType.addEventListener("change", function(){ state.animType = this.value; playAnimation(); });
    bindRange(els.animDuration, els.animDurationOut, "ms", function(v){ state.animDuration = Number(v); playAnimation(); });
    bindRange(els.animDelay, els.animDelayOut, "ms", function(v){ state.animDelay = Number(v); playAnimation(); });
    bindRange(els.animStagger, els.animStaggerOut, "ms", function(v){ state.animStagger = Number(v); playAnimation(); });
    els.animEasing.addEventListener("change", function(){ state.animEasing = this.value; playAnimation(); });
    bindRange(els.loopPause, els.loopPauseOut, "ms", function(v){ state.loopPause = Number(v); });
    els.loopToggle.addEventListener("change", function(){ state.loop = this.checked; if (state.loop) playAnimation(); else clearAllTimers(); });
    els.reducedMotionToggle.addEventListener("change", function(){ state.reducedMotion = this.checked; playAnimation(); });

    els.textColor.addEventListener("input", function(){ state.textColor = this.value; applyStaticTextStyles(); });
    els.colorSwatches.querySelectorAll(".swatch").forEach(function(sw){
      sw.addEventListener("click", function(){
        var c = sw.getAttribute("data-color");
        state.textColor = c; els.textColor.value = c; applyStaticTextStyles();
      });
    });

    els.plateToggle.addEventListener("change", function(){ state.plate = this.checked; els.plateBody.hidden = !state.plate; applyStaticTextStyles(); });
    els.plateColor.addEventListener("input", function(){ state.plateColor = this.value; applyStaticTextStyles(); });
    bindRange(els.platePadding, els.platePaddingOut, "px", function(v){ state.platePadding = Number(v); applyStaticTextStyles(); });
    bindRange(els.plateRadius, els.plateRadiusOut, "px", function(v){ state.plateRadius = Number(v); applyStaticTextStyles(); });

    els.shadowToggle.addEventListener("change", function(){ state.shadow = this.checked; els.shadowBody.hidden = !state.shadow; applyStaticTextStyles(); });
    bindRange(els.shadowX, els.shadowXOut, "px", function(v){ state.shadowX = Number(v); applyStaticTextStyles(); });
    bindRange(els.shadowY, els.shadowYOut, "px", function(v){ state.shadowY = Number(v); applyStaticTextStyles(); });
    bindRange(els.shadowBlur, els.shadowBlurOut, "px", function(v){ state.shadowBlur = Number(v); applyStaticTextStyles(); });
    bindRange(els.shadowOpacity, els.shadowOpacityOut, "%", function(v){ state.shadowOpacity = Number(v); applyStaticTextStyles(); });
    els.shadowColor.addEventListener("input", function(){ state.shadowColor = this.value; applyStaticTextStyles(); });

    els.glowToggle.addEventListener("change", function(){ state.glow = this.checked; els.glowBody.hidden = !state.glow; applyStaticTextStyles(); });
    bindRange(els.glowBlur, els.glowBlurOut, "px", function(v){ state.glowBlur = Number(v); applyStaticTextStyles(); });
    bindRange(els.glowOpacity, els.glowOpacityOut, "%", function(v){ state.glowOpacity = Number(v); applyStaticTextStyles(); });
    els.glowColor.addEventListener("input", function(){ state.glowColor = this.value; applyStaticTextStyles(); });

    els.strokeToggle.addEventListener("change", function(){ state.stroke = this.checked; els.strokeBody.hidden = !state.stroke; applyStaticTextStyles(); });
    bindRange(els.strokeWidth, els.strokeWidthOut, "px", function(v){ state.strokeWidth = Number(v); applyStaticTextStyles(); });
    els.strokeColor.addEventListener("input", function(){ state.strokeColor = this.value; applyStaticTextStyles(); });

    bindRange(els.textOpacity, els.textOpacityOut, "%", function(v){ state.textOpacity = Number(v); applyStaticTextStyles(); });

    els.stageBgColor.addEventListener("input", function(){ state.stageBg = this.value; els.stage.style.background = state.stageBg; });
    els.guidesToggle.addEventListener("change", function(){ state.guides = this.checked; els.stageGuides.hidden = !state.guides; });

    els.replayBtn.addEventListener("click", playAnimation);

    els.resetBtn.addEventListener("click", function(){
      var reduced = state.reducedMotion;
      state = Object.assign({}, DEFAULT_STATE);
      state.reducedMotion = reduced;
      syncControlsFromState();
      playAnimation();
      announce("Settings reset to defaults");
    });

    els.exportBtn.addEventListener("click", function(){
      var expanded = els.exportBtn.getAttribute("aria-expanded") === "true";
      els.exportBtn.setAttribute("aria-expanded", String(!expanded));
      els.exportPanel.hidden = expanded;
      if (!expanded) els.exportCode.textContent = JSON.stringify(buildExportObject(), null, 2);
    });
    els.copyJsonBtn.addEventListener("click", function(){
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(els.exportCode.textContent).then(function(){
          announce("Configuration copied to clipboard");
        }, function(){
          announce("Copy failed — select the text and copy manually");
        });
      } else {
        announce("Clipboard unavailable — select the text and copy manually");
      }
    });

    /* tabs */
    var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
    tabs.forEach(function(tab, idx){
      tab.addEventListener("click", function(){ activateTab(tab); });
      tab.addEventListener("keydown", function(e){
        var newIdx = null;
        if (e.key === "ArrowRight") newIdx = (idx + 1) % tabs.length;
        else if (e.key === "ArrowLeft") newIdx = (idx - 1 + tabs.length) % tabs.length;
        else if (e.key === "Home") newIdx = 0;
        else if (e.key === "End") newIdx = tabs.length - 1;
        if (newIdx !== null){
          e.preventDefault();
          tabs[newIdx].focus();
          activateTab(tabs[newIdx]);
        }
      });
    });
    function activateTab(tab){
      tabs.forEach(function(t){
        var selected = t === tab;
        t.setAttribute("aria-selected", selected ? "true" : "false");
        t.tabIndex = selected ? 0 : -1;
        document.getElementById(t.getAttribute("aria-controls")).hidden = !selected;
      });
    }

    /* modal open / close + focus trap */
    els.closeBtn.addEventListener("click", requestClose);
    els.applyBtn.addEventListener("click", function(){
      parent.postMessage({ type: "vidkit:applyAdvancedText", payload: buildExportObject() }, "*");
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape") requestClose();
      if (e.key === "Tab") trapFocus(e);
    });
  }

  function requestClose(){
    clearAllTimers();
    els.tallyDot.classList.remove("is-live");
    parent.postMessage({ type: "vidkit:closeAdvancedText" }, "*");
  }
  function trapFocus(e){
    var selector = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
    var focusables = Array.prototype.slice.call(els.appModal.querySelectorAll(selector))
      .filter(function(el){ return el.offsetParent !== null && !el.disabled; });
    if (!focusables.length) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }

  function buildSwatches(){
    SWATCHES.forEach(function(c){
      var sw = document.createElement("button");
      sw.type = "button";
      sw.className = "swatch";
      sw.style.background = c;
      sw.setAttribute("data-color", c);
      sw.setAttribute("aria-label", "Set text colour " + c);
      els.colorSwatches.appendChild(sw);
    });
  }

  function init(){
    buildSwatches();

    var mql = window.matchMedia("(prefers-reduced-motion: reduce)");
    state.reducedMotion = mql.matches;

    syncControlsFromState();
    bindEvents();

    if (document.fonts && document.fonts.ready){
      document.fonts.ready.then(playAnimation).catch(playAnimation);
    } else {
      setTimeout(playAnimation, 200);
    }
  }

  function applyIncomingClip(data){
    state = Object.assign({}, DEFAULT_STATE, data || {});
    syncControlsFromState();
    playAnimation();
  }
  window.addEventListener("message", function(e){
    if (e.data && e.data.type === "vidkit:loadClip") applyIncomingClip(e.data.payload);
  });
  parent.postMessage({ type: "vidkit:iframeReady" }, "*");


  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>

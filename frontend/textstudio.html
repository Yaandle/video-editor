<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Studio</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">{ "imports": { "#renderer/": "/renderer/", "#vendor/": "/vendor/" } }</script>
<style>
  /* Text Studio — the editor's Advanced Text option. Same chrome as the editor:
     flat fills, ink borders, hard shadows, left-aligned type, no motion in CSS. */
  body { flex-direction: column; }
  #ts-head { height: 56px; flex: none; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4); border-bottom: var(--bw) solid var(--ink); background: var(--white); }
  #ts-head h1 { font: 400 20px/1 var(--f-display); letter-spacing: -.01em; }
  #ts-head .clip { font: 400 11px/1 var(--f-mono); color: var(--ink-soft); }
  #ts-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 400px 1fr; }
  #ts-controls { overflow: auto; border-right: var(--bw) solid var(--ink); background: var(--paper); }
  #ts-preview { display: flex; flex-direction: column; min-width: 0; background: var(--paper-deep); }
  #ts-stage { flex: 1; position: relative; min-height: 0; }
  #ts-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ts-bar { height: 52px; flex: none; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); border-top: var(--bw) solid var(--ink); background: var(--paper); }
  #ts-bar input[type=range] { flex: 1; }
  #ts-time { font: 700 13px/1 var(--f-mono); min-width: 120px; text-align: right; }
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); padding: var(--s3); border-bottom: var(--bw) solid var(--ink); }
  .preset { text-align: left; padding: 8px 10px; background: var(--white); border: var(--bw) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; font: 700 12px/1.2 var(--f-body); }
  .preset small { display: block; font: 400 10px/1.2 var(--f-mono); color: var(--ink-soft); margin-top: 3px; }
  .preset:hover { background: var(--lime); }
  .preset.on { background: var(--ink); color: var(--lime); }
  .preset.on small { color: var(--paper); }
  .textbox { padding: var(--s3); border-bottom: var(--bw) solid var(--ink); display: grid; gap: var(--s2); }
  .textbox textarea { min-height: 96px; font: 500 15px/1.35 var(--f-body); }
  .problems { margin: var(--s3); }
  .llm-only { display: none; }
  body.llm-on .llm-only { display: grid; }
  .kc-lines { display: grid; gap: 4px; font: 400 12px/1.3 var(--f-mono); }
</style>
</head>
<body>
<header id="ts-head">
  <h1>Text Studio</h1>
  <span class="clip" id="ts-clip">—</span>
  <span class="spacer"></span>
  <button class="btn" id="ts-cancel" type="button">Cancel</button>
  <button class="btn primary" id="ts-apply" type="button">Apply to clip</button>
</header>
<main id="ts-main">
  <aside id="ts-controls" aria-label="Text settings"></aside>
  <section id="ts-preview" aria-label="Preview">
    <div id="ts-stage"><canvas id="ts-canvas" role="img" aria-label="Preview of the text clip, drawn by the export renderer"></canvas></div>
    <div id="ts-bar">
      <button class="btn icon primary" id="ts-play" type="button" title="Play / pause (Space)" data-icon="play"></button>
      <label class="toggle"><input type="checkbox" id="ts-loop" checked> Loop</label>
      <input type="range" id="ts-scrub" min="0" max="1" step="0.001" value="0" aria-label="Scrub">
      <span id="ts-time">0.000 s</span>
    </div>
  </section>
</main>
<script type="module">
import { createRenderer } from './renderer/core.js';
import * as registry from './renderer/registry.js';
import { setTokens } from './renderer/tokens.js';
import { loadPack } from './renderer/styles.js';
import { TEXT_STYLES, applyStyle } from './renderer/components/text.js';
import { el, field, section, schemaFields, decorateIcons } from './forms.js';
import { Transport } from './transport.js';

const $ = (s) => document.querySelector(s);
const GROUPS = {
  Type: ['role', 'font', 'weight', 'size_px', 'align', 'width', 'case', 'leading', 'tracking'],
  Colour: ['color', 'accent', 'highlight', 'plate', 'plate_fill', 'outline', 'outline_color', 'hard_shadow'],
  Motion: ['anim_unit', 'anim_from', 'anim_preset', 'anim_stagger', 'anim_delay', 'exit_to', 'exit_preset', 'hit', 'sfx'],
};

let clip = null, settings = null, renderer = null, packs = [], llm = false;
const transport = new Transport((t) => draw(t), { loop: true });

function preview() {
  // A one-clip project: the clip as placed in the edit, on the project's background.
  const c = JSON.parse(JSON.stringify(clip));
  c.start = 0; c.layer = 0;
  return { schema: 'vidkit.project', version: 1, name: 'textstudio',
    settings: { ...settings, duration: c.duration }, tracks: [], clips: [c], audio: { music: null, auto_sfx: false, cues: [] }, meta: {} };
}

async function refresh() {
  await renderer.update(preview());
  const errs = renderer.errors;
  $('#ts-apply').disabled = errs.length > 0;
  const box = document.querySelector('.problems');
  box.innerHTML = '';
  if (errs.length) box.append(el('p', { class: 'warn', text: errs.slice(0, 4).join('\n') }));
  draw(transport.t);
}

function draw(t) {
  const cv = $('#ts-canvas');
  const P = cv.parentElement;
  const dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(P.clientWidth * dpr) || cv.height !== Math.round(P.clientHeight * dpr)) {
    cv.width = Math.round(P.clientWidth * dpr); cv.height = Math.round(P.clientHeight * dpr);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, P.clientWidth, P.clientHeight);
  const pad = 28, aw = P.clientWidth - pad * 2, ah = P.clientHeight - pad * 2;
  const k = Math.min(aw / settings.width, ah / settings.height);
  const w = settings.width * k, h = settings.height * k, x = (P.clientWidth - w) / 2, y = (P.clientHeight - h) / 2;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink');
  ctx.fillRect(x + 8, y + 8, w, h);
  try { renderer.renderFrame(ctx, Math.min(t, clip.duration - 1e-3), { x, y, width: w, height: h }); }
  catch (e) { ctx.fillStyle = '#FF4F1F'; ctx.fillRect(x, y, w, h); document.querySelector('.problems').textContent = e.message; }
  $('#ts-scrub').value = String(t / clip.duration);
  $('#ts-time').textContent = `${t.toFixed(3)} s`;
}

function setProp(k, v, final = true) {
  clip.props = { ...clip.props, [k]: v };
  if (k !== 'style' && clip.type === 'text' && clip.props.style !== 'custom' && GROUPS.Type.concat(GROUPS.Colour, GROUPS.Motion).includes(k)) clip.props.style = 'custom';
  if (final) build();
  refresh();
}

function build() {
  const root = $('#ts-controls');
  const scroll = root.scrollTop;
  root.innerHTML = '';
  const def = registry.get(clip.type);
  const props = registry.resolveProps(clip.type, clip.props).value;
  if (clip.type === 'text') {
    const grid = el('div', { class: 'presets' });
    for (const [id, s] of Object.entries(TEXT_STYLES)) {
      const b = el('button', { type: 'button', class: `preset ${props.style === id ? 'on' : ''}` }, s.label, el('small', { text: `${s.role} · ${s.anim_from}${s.anim_unit ? ` by ${s.anim_unit}` : ''}` }));
      b.addEventListener('click', () => { clip.props = applyStyle({ ...clip.props }, id); build(); refresh(); });
      grid.append(b);
    }
    root.append(grid);
  }
  const textKey = def.schema.text ? 'text' : Object.keys(def.schema).find((k) => def.schema[k].type === 'text');
  if (textKey) {
    const ta = el('textarea', { spellcheck: 'true', 'aria-label': 'Text' });
    ta.value = props[textKey] ?? '';
    ta.addEventListener('input', () => setProp(textKey, ta.value, false));
    root.append(el('div', { class: 'textbox' }, el('span', { class: 'label', text: 'Text — [[highlight]]  {{accent}}  Enter = new line' }), ta));
  }
  root.append(el('div', { class: 'problems' }));
  const used = new Set([textKey, 'style']);
  for (const [g, keys] of Object.entries(GROUPS)) {
    const ks = keys.filter((k) => def.schema[k]);
    if (!ks.length) continue;
    ks.forEach((k) => used.add(k));
    const sub = Object.fromEntries(ks.map((k) => [k, def.schema[k]]));
    root.append(section(g, g !== 'Colour', ...schemaFields(sub, props, (k, v, m) => setProp(k, v, m.final))));
  }
  const rest = Object.fromEntries(Object.entries(def.schema).filter(([k]) => !used.has(k)));
  if (Object.keys(rest).length) root.append(section('More', true, ...schemaFields(rest, props, (k, v, m) => setProp(k, v, m.final))));
  root.append(styleSection());
  root.append(timingSection());
  if (llm) root.append(kineticCopy(textKey));
  decorateIcons(root);
  root.scrollTop = scroll;
}

function styleSection() {
  const ids = registry.stylePacks().map((p) => p.id);
  const labels = Object.fromEntries(registry.stylePacks().map((p) => [p.id, p.label]));
  labels['(project)'] = `Project style (${labels[settings.style] ?? settings.style})`;
  const rows = [field('style', { type: 'enum', label: 'Style pack', options: ['(project)', ...ids], optionLabels: labels }, clip.style ?? '(project)', async (v) => {
    const id = v === '(project)' ? null : v;
    if (id) await loadPack(id);
    clip.style = id; clip.style_params = {};
    build(); refresh();
  }, { selectEnums: true })];
  const id = clip.style ?? settings.style;
  const pack = registry.stylePack(id);
  if (clip.style && pack && Object.keys(pack.schema).length) {
    rows.push(...schemaFields(pack.schema, registry.styleParams(id, clip.style_params).value, (k, v, m) => {
      clip.style_params = { ...(clip.style_params ?? {}), [k]: v };
      if (m.final) build();
      refresh();
    }));
  }
  rows.push(el('p', { class: 'hint', text: pack?.description ?? '' }));
  return section('Style pack', true, ...rows);
}

function timingSection() {
  return section('Clip', false, field('duration', { type: 'number', label: 'Duration s', min: 0.1, max: 120, step: 0.01 }, clip.duration, (v, m) => {
    clip.duration = v; if (m.final) build(); refresh();
  }, { noRange: true }));
}

function kineticCopy(textKey) {
  const beats = el('input', { type: 'number', min: 2, max: 64, step: 1, value: Math.max(2, Math.round(clip.duration / (60 / (settings.bpm || 120)))) });
  const out = el('div', { class: 'kc-lines' });
  const go = el('button', { class: 'btn sm', type: 'button', 'data-icon': 'magic-wand', text: 'Rewrite for kinetic pacing' });
  go.addEventListener('click', async () => {
    out.textContent = 'Asking the local model…';
    const r = await fetch('/api/llm/kinetic-copy', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: clip.props[textKey] ?? '', beats: Number(beats.value) }) }).then((x) => x.json()).catch((e) => ({ error: e.message }));
    out.innerHTML = '';
    if (!r.available || r.error) { out.textContent = r.reason ?? r.error ?? 'unavailable'; return; }
    for (const l of r.lines) out.append(el('span', { text: `${l.beats}♩  ${l.text}   (emphasis: ${l.emphasis})` }));
    const use = el('button', { class: 'btn sm', type: 'button', text: 'Use these lines' });
    use.addEventListener('click', () => {
      const text = r.lines.map((l) => l.text.replace(new RegExp(`\\b(${l.emphasis.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})\\b`), '[[$1]]')).join('\n');
      setProp(textKey, text, true);
    });
    out.append(use);
  });
  const box = section('Kinetic copy (local model)', false, field('beats', { type: 'number', label: 'Beats', min: 2, max: 64, step: 1 }, beats.value, (v) => { beats.value = v; }, { noRange: true }), go, out);
  box.classList.add('llm-only');
  return box;
}

async function open(msg) {
  clip = msg.clip;
  settings = msg.settings;
  packs = msg.packs ?? [];
  llm = !!msg.llm;
  document.body.classList.toggle('llm-on', llm);
  $('#ts-clip').textContent = `${registry.get(clip.type)?.label ?? clip.type} · ${clip.id} · ${clip.duration.toFixed(2)} s`;
  if (!renderer) {
    const tok = await (await fetch('/design/tokens.json')).json();
    setTokens(tok);
    renderer = await createRenderer({ mode: 'preview', base: '/', tokens: tok });
    await renderer.load(preview());
  }
  transport.pause();
  transport.t = Math.min(clip.duration * 0.6, 1.5);
  build();
  await refresh();
}

const post = (m) => parent.postMessage({ source: 'textstudio', ...m }, location.origin);
$('#ts-apply').addEventListener('click', () => { transport.pause(); post({ type: 'apply', clip }); });
$('#ts-cancel').addEventListener('click', () => { transport.pause(); post({ type: 'cancel' }); });
$('#ts-play').addEventListener('click', () => { if (transport.playing) transport.pause(); else transport.play(clip.duration); $('#ts-play').classList.toggle('on', transport.playing); });
$('#ts-loop').addEventListener('change', (e) => { transport.loop = e.target.checked; });
$('#ts-scrub').addEventListener('input', (e) => { transport.pause(); transport.seek(parseFloat(e.target.value) * clip.duration); draw(transport.t); });
addEventListener('message', (e) => { if (e.origin === location.origin && e.data?.type === 'open') open(e.data).catch((err) => { document.querySelector('#ts-controls').textContent = err.message; }); });
addEventListener('resize', () => clip && draw(transport.t));
addEventListener('keydown', (e) => { if (e.key === ' ' && !['TEXTAREA', 'INPUT', 'SELECT'].includes(e.target.tagName)) { e.preventDefault(); $('#ts-play').click(); } if (e.key === 'Escape') $('#ts-cancel').click(); });
decorateIcons();
</script>
</body>
</html>
